.ios .wpb{display:block;width:100%;border:0;border-radius:14px;background:var(--bl);color:#fff;font:600 17px/1 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:16px;margin:10px 0;cursor:pointer;text-align:center;text-decoration:none}
.ios .wsb{display:block;width:100%;border:0;border-radius:14px;background:rgba(120,120,128,.14);color:var(--bl);font:600 16px/1 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:14px;margin:8px 0;cursor:pointer;text-align:center;text-decoration:none}
.ios .wpb:disabled,.ios .wsb:disabled{opacity:.35}
.ios .wseg{display:flex;background:rgba(120,120,128,.14);border-radius:10px;padding:2px;margin:12px 0}
.ios .wseg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 1px;font:600 11px/1.2 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--mu);cursor:pointer}

.ios .wseg button.dn{color:var(--gr)}
.ios .wbar{height:4px;background:rgba(120,120,128,.18);border-radius:2px;overflow:hidden}.ios .wbar i{display:block;height:100%;background:var(--bl);border-radius:2px;transition:width .25s}
.ios .wnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.ios .wnav button{flex:none;border:0;border-radius:12px;padding:12px 18px;font:600 16px/1 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;cursor:pointer;background:rgba(120,120,128,.14);color:var(--bl)}
.ios .wnav button.p{background:var(--bl);color:#fff}.ios .wnav button:disabled{opacity:.35}
.ios .wnav span{color:var(--mu);font-size:14px}
.ios textarea,.ios input{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:12px;padding:12px;font:14px/1.4 ui-monospace,Menlo,monospace}
.ios .msg{color:var(--rd);font-weight:600;min-height:1.2em;font-size:14px}.ios .msg.ok{color:var(--gr)}
.ios hr{border:0;border-top:1px solid var(--ln);margin:16px 0}
.ios .wnote{font-size:12px;color:var(--mu);text-align:center;margin-top:10px}
.ios .winfo{background:rgba(10,132,255,.1);border-radius:14px;padding:12px 14px;font-size:14px;margin:12px 0}
.ios pre.r{max-height:120px;overflow:auto;font-size:10px;background:var(--bg);border-radius:10px;padding:8px;white-space:pre-wrap;margin:6px 0}
.wmc{border-radius:12px;overflow:hidden;border:1px solid var(--ln);background:#fff;color:#222;font:12px/1.35 -apple-system,sans-serif;margin:8px 0}
.wmt{display:flex;justify-content:space-between;background:#fff;border-bottom:1px solid #e3e3e3;padding:7px 10px}.wmt i{font-style:normal;color:#666}
.wmb{display:flex;min-height:190px}.wms{width:38%;background:#f6f6f6;border-right:1px solid #e3e3e3;padding:6px 0}
.wsi{position:relative;padding:6px 9px;color:#444}.wsi.wsub{padding-left:20px;font-size:11px}
.wsi.hi,.hi{outline:2.5px solid #ff3b30;outline-offset:1px;border-radius:6px;animation:pls 1.3s infinite}

.wmm{flex:1;padding:10px;display:flex;flex-direction:column;gap:7px;justify-content:center}
.wmm small{color:#777;font-size:10px}
em{position:absolute;right:-7px;top:-9px;width:17px;height:17px;border-radius:50%;background:#ff3b30;color:#fff;font:700 10px/17px sans-serif;text-align:center;font-style:normal}
